name: Publish HAxBRO Prototype AI Model

on:
push:
branches:
- main
paths:
- 'haxbro-brain-source.zip'
- '.github/workflows/pages.yml'
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare website from ZIP
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p site extracted

      if [ ! -f haxbro-brain-source.zip ]; then
        echo "ERROR: haxbro-brain-source.zip is missing from the repository root."
        exit 1
      fi

      unzip -q haxbro-brain-source.zip -d extracted

      if [ -f extracted/haxbro-brain/index.html ]; then
        cp extracted/haxbro-brain/index.html site/index.html
      elif [ -f extracted/index.html ]; then
        cp extracted/index.html site/index.html
      else
        echo "ERROR: index.html was not found inside the ZIP."
        find extracted -maxdepth 4 -type f | head -100
        exit 1
      fi

      cp haxbro-brain-source.zip site/haxbro-brain-source.zip

      echo "Website files prepared successfully."
      ls -la site

  - name: Configure GitHub Pages
    uses: actions/configure-pages@v5

  - name: Upload website artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: site

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}

runs-on: ubuntu-latest
needs: build

steps:
  - name: Publish website
    id: deployment
    uses: actions/deploy-pages@v4
